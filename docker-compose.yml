version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: canelas-bakery-db
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - canelas-bakery-backend-network

networks:
  canelas-bakery-backend-network:
    driver: bridge